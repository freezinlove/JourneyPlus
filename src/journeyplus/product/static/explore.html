<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JourneyPlus · 关系探索</title><link rel="stylesheet" href="/assets/workspace.css"><link rel="stylesheet" href="/assets/explore.css"><script type="module" src="/assets/explore.js"></script></head><body>
<header><a class="brand" href="/knowledge">JourneyPlus</a><span>关系探索 · 预览</span><a href="/workspace">在工作区继续讨论</a></header>
<main><section id="intro"><p class="eyebrow">从会籍到机会</p><h1>看看你能走到哪里。</h1><p>按你的条件探索已核实的路径。节点可查看取得方式，更多候选逐页展开。</p></section>
<form id="explore-form"><fieldset><legend>从哪里出发</legend><div class="search-row"><label>查找会籍项目<input id="program-search" placeholder="例如 Air Canada" minlength="2" maxlength="100"></label><button id="search" type="button">查找</button></div><label>本次起点<select id="source"><option value="saved">使用已确认会籍</option><option value="public">只看公开申请机会</option></select></label><small id="catalog-notice">这里的选择只用于本次查询，不会保存为持有会籍。</small></fieldset>
<fieldset><legend>希望找到什么</legend><label>目标类型<select id="category"><option value="">不限类型</option><option value="AIRLINE">航司</option><option value="HOTEL">酒店</option><option value="CRUISE">邮轮</option><option value="OTHER">其他项目</option></select></label><label>航司联盟<select id="alliance" disabled><option value="">不限联盟</option></select></label><small id="alliance-notice"></small><div class="search-row"><label>已知费用预算<input id="amount" type="number" min="0" step="0.01" placeholder="不限"></label><label>币种<select id="currency"><option>USD</option><option>EUR</option><option>CNY</option></select></label></div><label class="checkbox"><input id="free" type="checkbox">只看明确免费的申请</label><small>费用与资格未知会明确列出；不同币种不会自动换算。</small></fieldset><button id="query" type="submit" disabled>探索路径</button></form>
<p id="notice" role="status"></p><section id="results" aria-label="匹配关系"></section><button id="more" hidden>继续展开路径</button></main>
<dialog id="detail"><div class="detail-head"><h2>申请方式</h2><button id="close" aria-label="关闭详情">关闭</button></div><div id="detail-content"></div></dialog></body></html>
