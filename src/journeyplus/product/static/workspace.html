<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JourneyPlus · 会籍工作区</title><link rel="stylesheet" href="/assets/workspace.css"><script src="/assets/workspace.js" type="module"></script></head>
<body><header><a class="brand" href="/">JourneyPlus</a><span>会籍工作区 · 预览</span><a href="/explore">关系探索</a><button id="new">新对话</button></header>
<main><section id="intro"><p class="eyebrow">从你的问题开始</p><h1>下一段旅程，<br>从哪张会籍出发？</h1><p>查询活动细节，探索匹配路径，或继续比较。<br>涉及会籍保存和等待任务时，会先请你确认。</p></section><section id="messages" aria-live="polite" aria-label="对话"></section><p id="notice" role="status"></p></main>
<footer><form id="composer"><label class="sr-only" for="input">你的问题</label><textarea id="input" rows="2" maxlength="6000" placeholder="直接说出你的问题…" required></textarea><button id="send" type="submit">发送 ↗</button></form><small>工作区临时保留 24 小时 · 只有确认的会籍会长期保存</small></footer>
<dialog id="detail"><div class="detail-head"><h2>方案详情</h2><button id="close" aria-label="关闭详情">关闭</button></div><div id="detail-content"></div></dialog></body></html>
