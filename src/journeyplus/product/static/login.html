<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · JourneyPlus</title><link rel="stylesheet" href="/assets/workspace_v3.css"><style>main{max-width:380px;margin:15vh auto;padding:24px}label,input,button{display:block;width:100%;box-sizing:border-box;margin:12px 0}input,button{padding:12px}#error{color:#a33}</style><main><h1>JourneyPlus</h1><p>登录后管理你的会籍，继续当前对话。</p><form id="login"><label>用户名<input name="username" autocomplete="username" required></label><label>密码<input name="password" type="password" autocomplete="current-password" required></label><button>登录</button><p id="error" role="alert"></p></form></main><script>
document.querySelector('form').onsubmit=async e=>{e.preventDefault();const button=e.target.querySelector('button');button.disabled=true;try{const r=await fetch('/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});if(!r.ok)throw Error('账号或密码不正确，或请稍后重试。');sessionStorage.clear();new BroadcastChannel('journeyplus-account').postMessage('login');location.replace("__LOGIN_LANDING__");}catch(err){document.querySelector('#error').textContent=err.message;}finally{button.disabled=false;}};
</script></html>
