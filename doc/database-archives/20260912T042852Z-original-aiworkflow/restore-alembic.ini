[alembic]
script_location = /Users/xd/Documents/ChatGPT/JourneyPlus/doc/database-archives/20260912T042852Z-original-aiworkflow/legacy-source/migrations
prepend_sys_path = .
path_separator = os
sqlalchemy.url = sqlite+pysqlite:///./journeyplus.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
