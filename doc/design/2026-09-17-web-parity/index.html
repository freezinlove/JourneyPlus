<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JourneyPlus · Web 原型对照</title><style>*{box-sizing:border-box}body{margin:0;padding:24px;background:#e8ebef;color:#202832;font:14px -apple-system,BlinkMacSystemFont,sans-serif}h1{font-size:22px;font-weight:500}p{line-height:1.8;color:#5a6573;max-width:900px}nav{display:flex;gap:12px;margin:20px 0}select{padding:9px 14px;border-radius:12px;border:1px solid #dae0e7;background:#fff}main{display:grid;grid-template-columns:1fr 1fr;gap:20px}figure{margin:0}figcaption{margin:12px 0}img{display:block;width:100%;border-radius:14px;border:1px solid #dae0e7}a{color:#294f73}@media(max-width:800px){main{grid-template-columns:1fr}}</style><h1>Web 实现 / HTML 原型</h1><p>同一浏览器、1440 × 960 产品画布。测试数据只用于视觉验收，没有写入产品数据库。原型外部评审条和展示边框已移除。新闻日期与字段以原前端为准，原型专用标签不进入产品；对话中的演示免责声明不进入真实回复。</p><nav><select id="page" aria-label="页面"><option value="chat">对话</option><option value="news">会籍新闻</option><option value="holdings">我的会籍</option></select><select id="theme" aria-label="主题"><option value="light">浅色</option><option value="dark">深色</option></select></nav><main><figure><figcaption>最终 HTML 原型</figcaption><img id="prototype" alt="HTML 原型截图"></figure><figure><figcaption>React Web 实现</figcaption><img id="actual" alt="React Web 截图"></figure></main><p><a href="reader-light.png">详情页</a> · <a href="editor-light.png">会籍编辑</a> · <a href="narrow-web.png">窄屏 Web</a> · <a href="README.md">字段与验证记录</a></p><script>const page=document.getElementById('page'),theme=document.getElementById('theme');function render(){document.getElementById('prototype').src=`prototype-${page.value}-${theme.value}.png`;document.getElementById('actual').src=`${page.value}-${theme.value}.png`;}page.onchange=theme.onchange=render;render();</script></html>
