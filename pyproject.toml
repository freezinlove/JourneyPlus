[project]
name = "journeyplus"
version = "0.1.0"
description = "Status acquisition opportunity ingestion and briefing pipeline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.17,<2",
  "fastapi>=0.116,<1",
  "feedparser>=6.0.12,<7",
  "google-auth>=2.40,<3",
  "google-auth-oauthlib>=1.2,<2",
  "httpx>=0.28,<1",
  "markdownify>=1.2,<2",
  "pydantic>=2.11,<3",
  "psycopg[binary]>=3.2,<4",
  "python-dotenv>=1.1,<2",
  "selectolax>=0.3.30,<1",
  "sqlalchemy>=2.0.43,<3",
  "uvicorn>=0.35,<1",
  "playwright>=1.55,<2",
]

[project.optional-dependencies]
dev = [
  "jsonschema>=4.23,<5",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
]

[project.scripts]
journeyplus = "journeyplus.cli:main"
journeyplus-eval = "journeyplus.evaluation.cli:main"
journeyplus-gold-run = "journeyplus.evaluation.runtime_cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/journeyplus"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["journeyplus"]
