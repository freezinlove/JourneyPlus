name: 发布 JourneyPlus

on:
  workflow_dispatch:

permissions:
  contents: read

# 点两次也串行执行，不能中途取消正在迁移数据库的发布。
concurrency:
  group: journeyplus-production
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: 检查配置与回归测试
        run: |
          python -m pip install uv==0.11.26
          uv sync --frozen --extra dev
          uv run --frozen pytest tests/test_minimal_users.py tests/test_ai_provider.py tests/test_deployment_scripts.py
          bash -n scripts/deploy/entry.sh scripts/deploy/release.sh
          JOURNEYPLUS_POSTGRES_PASSWORD=ci-placeholder \
            docker compose --env-file .env.deploy.example -f compose.deploy.yaml config --no-env-resolution --quiet
      - id: image
        name: 设置镜像名称
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        name: 构建并上传版本镜像
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - name: 配置专用 SSH 凭证
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/journeyplus_deploy
          chmod 600 ~/.ssh/journeyplus_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: 部署指定镜像并检查健康状态
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          IMAGE: ${{ needs.build.outputs.image }}@${{ needs.build.outputs.digest }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          printf '%s' "$GHCR_TOKEN" | ssh -T \
            -i ~/.ssh/journeyplus_deploy -o IdentitiesOnly=yes \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            "$DEPLOY_USER@$DEPLOY_HOST" "deploy $GITHUB_SHA $IMAGE"
      - name: 清理运行器凭证
        if: always()
        run: rm -f ~/.ssh/journeyplus_deploy
      - name: 发布结果
        if: always()
        env:
          RESULT: ${{ job.status }}
          IMAGE: ${{ needs.build.outputs.image }}@${{ needs.build.outputs.digest }}
        run: |
          {
            echo "## JourneyPlus 发布：$RESULT"
            echo "提交：$GITHUB_SHA"
            echo "镜像：$IMAGE"
            echo "详细阶段和备份路径见部署日志；数据库不自动回滚。"
          } >> "$GITHUB_STEP_SUMMARY"
